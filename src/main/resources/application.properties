# Server Port Configuration
server.port=8080

# Spring Application Name
spring.application.name=EmployeeManagement

# MySQL Database Configuration
# Update username and password below to match your local MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Alternative: If local MySQL service is not running or credentials differ,
# activate the H2 profile by running: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
